<script type="text/javascript">
RED.nodes.registerType('runner-flow', {
    category: 'function',
    color: '#d8bfd8',
    inputs: 0,
    outputs: 1,
    defaults: {
        name: { value: '' },
        flowId: { value: '', required: true },
        port: { value: 1881, required: true, validate: RED.validators.number() },
        forwardOutput: { value: true },
        forwardToConsole: { value: false },
    },
    label: function () { return this.name || 'runner flow'; },
    oneditprepare: function () {
        const select = $('#node-input-flowId');
        const selected = this.flowId;
        select.empty().append($('<option>', { value: '', text: 'Select a disabled flow' }));
        RED.nodes.eachWorkspace(function (node) {
            if (node.type === 'tab' && node.disabled) {
                select.append($('<option>', {
                    value: node.id,
                    text: `${node.label || 'Unnamed flow'} (${node.id})`,
                }));
            }
        });
        select.val(selected);
    },
});
</script>

<script type="text/x-red" data-template-name="runner-flow">
    <div class="form-row"><label for="node-input-name"><i class="fa fa-tag"></i> Name</label><input id="node-input-name"></div>
    <div class="form-row"><label for="node-input-flowId"><i class="fa fa-sitemap"></i> Disabled flow</label><select id="node-input-flowId"></select></div>
    <div class="form-row"><label for="node-input-port"><i class="fa fa-plug"></i> Port</label><input id="node-input-port" type="number" min="1" max="65535"></div>
    <div class="form-row"><label for="node-input-forwardOutput"><i class="fa fa-sign-out"></i> Emit output</label><input id="node-input-forwardOutput" type="checkbox" style="width:auto"></div>
    <div class="form-row"><label for="node-input-forwardToConsole"><i class="fa fa-terminal"></i> Mirror to console</label><input id="node-input-forwardToConsole" type="checkbox" style="width:auto"></div>
</script>

<script type="text/x-red" data-help-name="runner-flow">
    <p>Runs a disabled flow tab in an isolated process. Configure the tab ID and a dedicated HTTP port. Its output emits CPU and memory metrics every second. Optionally emit subprocess stdout/stderr or mirror them to the parent process console.</p>
</script>
